server {
    listen 80 default_server;
    listen 127.0.0.1:7311;
    server_name _;
    root /srv/vigia-web;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 12m;
    location ~ ^/(inicio|equipos|app|tablero|sucursal|entrar)$ {
        include /etc/nginx/vigia-proxy.conf;
        error_page 502 504 =503 /nodo-no-disponible.html;
    }
    location ~ ^/(api/|[^/]+\.js$|manifest\.webmanifest$|icono[^/]*$|placas/) {
        include /etc/nginx/vigia-proxy.conf;
        error_page 502 504 = @nodo_api_no_disponible;
    }
    location @nodo_api_no_disponible {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"El nodo de Fedora no está disponible. Conserva tu captura y reintenta cuando vuelva a estar conectado."}';
    }
    location = /catalogo.html { return 302 /catalogo/; }
    location = /verificar { return 302 /verificar/; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { expires -1; }
    location ~ /\. { deny all; }
    location = /README.md { return 404; }
    location ~* \.mp4$ { types { video/mp4 mp4; } expires 1h; }
    location ~* \.vtt$ { types { text/vtt vtt; } expires 1h; }
    location ~* \.(png|jpg)$ { expires 1h; }
}
