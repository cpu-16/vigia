server {
    listen 80 default_server;
    listen 127.0.0.1:7311;
    server_name _;
    root /srv/vigia-web;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { expires -1; }
    location ~ /\. { deny all; }
    location = /README.md { return 404; }
    location ~* \.mp4$ { types { video/mp4 mp4; } expires 1h; }
    location ~* \.vtt$ { types { text/vtt vtt; } expires 1h; }
    location ~* \.(png|jpg)$ { expires 1h; }
}
