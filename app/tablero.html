<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigía · tablero de base instalada</title>
<style>
  :root{
    --papel:#F3EFE6; --papel-alto:#FBF9F4; --tinta:#16262E; --tinta-suave:#5C6B72;
    --raya:#DED7C7; --accion:#0F7B85; --alerta:#9C4221; --confirmado:#2F6B4F; --estimado:#8A6D1F;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.55 system-ui,-apple-system,sans-serif}
  .hoja{max-width:1080px;margin:0 auto;padding:0 24px 80px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
         padding:26px 0 14px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
  h1{font:400 34px/1 var(--serif);margin:0}
  h1 small{display:block;font:500 11px/1.4 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-suave);margin-top:7px}
  .vivo{font-size:13px;color:var(--tinta-suave);display:flex;align-items:center;gap:7px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--confirmado);animation:latir 2s infinite}
  @keyframes latir{50%{opacity:.25}}
  h2{font:400 21px var(--serif);margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--raya);
     display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h2 span{font:500 11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .kpi{background:var(--papel-alto);border:1px solid var(--raya);border-radius:14px;padding:16px 18px}
  .kpi b{display:block;font:400 40px/1 var(--serif)}
  .kpi small{color:var(--tinta-suave);font-size:12.5px;letter-spacing:.02em}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;align-items:start}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;font:600 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);
     padding:0 10px 8px 0;border-bottom:1px solid var(--raya)}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--raya);vertical-align:top}
  td.n{font:400 22px/1 var(--serif);white-space:nowrap}
  .sello{font:600 10px system-ui;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:99px;
         border:1px solid currentColor;white-space:nowrap}
  .Confirmed{color:var(--confirmado)} .Reported{color:var(--tinta-suave)}
  .Estimated{color:var(--estimado)} .Unknown{color:var(--alerta)}
  .corr{color:var(--accion);font-size:12px;white-space:nowrap}
  .barrita{height:8px;background:var(--tinta);border-radius:99px;min-width:3px}
  .barrita.vieja{background:var(--alerta)}
  .edad-reemplazar{color:var(--alerta);font-weight:600}
  .edad-planificar{color:var(--estimado)}
  .tec{font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tinta-suave);
       background:var(--papel-alto);border:1px solid var(--raya);border-radius:12px;padding:14px;white-space:pre-wrap}
  .vacio{color:var(--tinta-suave);font-style:italic;padding:14px 0}
  a{color:var(--accion)}
  .vivo a{margin-right:6px;padding-right:13px;border-right:1px solid var(--raya)}
</style>

<div class="hoja">
  <header>
    <h1>Vigía<small>Tablero de base instalada</small></h1>
    <span class="vivo"><a href="/verificar">Verificar un acta</a><i class="punto"></i><span id="vivo">en vivo</span></span>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="rejilla">
    <section>
      <h2>Base por país <span>unidades</span></h2>
      <table id="paises"></table>
      <h2>Por modalidad <span>unidades</span></h2>
      <table id="modalidades"></table>
    </section>
    <section>
      <h2>Oportunidades de renovación <span>regla COCIR</span></h2>
      <table id="renovaciones"></table>
      <h2>Información incompleta <span>próxima visita</span></h2>
      <table id="incompletos"></table>
    </section>
  </div>

  <h2>Clientes <span>Customer 360</span></h2>
  <div id="clientes"></div>

  <h2>Evidencia técnica <span>lo que el jurado revisa</span></h2>
  <div class="tec" id="evidencia">cargando…</div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const traer = r => fetch(r, { cache: 'no-store' }).then(r => r.json()).catch(() => null);

function tabla(el, cols, filas, pintaFila) {
  el.innerHTML = filas?.length
    ? `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>` + filas.map(pintaFila).join('')
    : `<tr><td class="vacio">Todavía no hay datos.</td></tr>`;
}

async function refrescar() {
  const [inv, paises, modalidades, ren, inc, ev] = await Promise.all([
    traer('/api/inventario'), traer('/api/agregado?por=country'), traer('/api/agregado?por=modality'),
    traer('/api/renovaciones'), traer('/api/incompletos'), traer('/api/evidencia')]);
  if (!inv) { $('#vivo').textContent = 'sin nodo'; return; }
  $('#vivo').textContent = `en vivo · ${new Date().toLocaleTimeString('es-PA')}`;

  const equipos = inv.flatMap(s => s.equipos);
  const unidades = equipos.reduce((n, e) => n + (e.quantity ?? 0), 0);
  const corroborados = equipos.filter(e => e.corroborado).length;
  $('#kpis').innerHTML = [
    [inv.length, 'clientes'], [unidades, 'unidades de equipo'],
    [corroborados, 'equipos corroborados por dos fuentes'],
    [(ren ?? []).filter(r => r.clase === 'reemplazar').length, 'equipos que superan los 10 años'],
  ].map(([n, t]) => `<div class="kpi"><b>${n}</b><small>${t}</small></div>`).join('');

  const max = Math.max(1, ...(paises ?? []).map(p => p.unidades));
  tabla($('#paises'), ['País', 'Unidades', '', 'Clientes'], paises, p =>
    `<tr><td>${esc(p.clave)}</td><td class="n">${p.unidades}</td>
     <td style="width:44%"><div class="barrita ${p.reemplazar ? 'vieja' : ''}" style="width:${p.unidades / max * 100}%"></div>
     ${p.reemplazar ? `<small style="color:var(--alerta)">${p.reemplazar} para reemplazar</small>` : ''}</td>
     <td>${p.clientes}</td></tr>`);

  const maxM = Math.max(1, ...(modalidades ?? []).map(m => m.unidades));
  tabla($('#modalidades'), ['Modalidad', 'Unidades', ''], modalidades, m =>
    `<tr><td>${esc(m.clave)}</td><td class="n">${m.unidades}</td>
     <td style="width:55%"><div class="barrita" style="width:${m.unidades / maxM * 100}%"></div></td></tr>`);

  tabla($('#renovaciones'), ['Cliente', 'Equipo', 'Edad', 'Motivo'], ren, r =>
    `<tr><td>${esc(r.customer)}<br><small style="color:var(--tinta-suave)">${esc(r.country ?? '')}</small></td>
     <td>${r.unidades ?? '?'}× ${esc(r.modality)}<br><small style="color:var(--tinta-suave)">${esc(r.manufacturer ?? 'marca desconocida')}</small></td>
     <td class="edad-${r.clase}">${r.edad} años</td><td><small>${esc(r.motivo)}</small></td></tr>`);

  tabla($('#incompletos'), ['Cliente', 'Equipo', 'Falta'], inc, i =>
    `<tr><td>${esc(i.customer)}</td><td>${esc(i.modality)}</td><td><small>${esc(i.faltan.join(', '))}</small></td></tr>`);

  $('#clientes').innerHTML = inv.length ? inv.map(s => `
    <h2 style="margin-top:26px">${esc(s.customer?.name ?? 'sin nombre')}
      <span>${esc([s.customer?.city, s.customer?.country].filter(Boolean).join(', '))}</span></h2>
    <table><tr><th>Cant.</th><th>Modalidad</th><th>Marca / modelo</th><th>Edad</th><th>Estado</th><th>Fuentes</th></tr>
    ${s.equipos.map(e => `<tr>
      <td class="n">${e.quantity ?? '?'}</td>
      <td>${esc(e.modality)}</td>
      <td>${esc(e.manufacturer ?? '—')}${e.model ? '<br><small style="color:var(--tinta-suave)">' + esc(e.model) + '</small>' : ''}</td>
      <td class="edad-${e.edad === 'reemplazar' ? 'reemplazar' : e.edad === 'planificar' ? 'planificar' : ''}">
        ${e.age_years_max != null ? e.age_years_max + ' años' : '—'}
        ${e.install_year_max ? `<br><small style="color:var(--tinta-suave)">inst. ~${e.install_year_max}</small>` : ''}</td>
      <td><span class="sello ${e.status}">${e.status}</span></td>
      <td>${esc(e.observadores.join(', ') || '—')}
        ${e.corroborado ? '<br><span class="corr">✓ dos fuentes independientes</span>' : ''}</td>
    </tr>`).join('')}</table>`).join('') : '<p class="vacio">Todavía no hay visitas guardadas.</p>';

  if (ev) $('#evidencia').textContent = [
    `SDK        ${ev.sdk}`,
    `Node       ${ev.node}`,
    `Modelo     ${ev.modelo} · ${ev.hardware} · ejecución ${ev.modo}`,
    `Voz        ${ev.voz ? 'Whisper cargado en este nodo' : 'no cargada'}`,
    `Llave nodo ${ev.llave_nodo}   (firma las actas; se verifica sin servidor)`,
    `Cadena     ${ev.cadena.valida ? `íntegra, ${ev.cadena.eventos} observaciones encadenadas` : `ROTA en el evento ${ev.cadena.en}: ${ev.cadena.motivo}`}`,
    `Inferencias ${ev.inferencias} · TTFT mediana ${ev.ttft_ms_mediana ?? '—'} ms · ${ev.tps_mediana ?? '—'} tok/s`,
    ``,
    `Últimas llamadas (evidencia/rendimiento.jsonl):`,
    ...(ev.ultimas ?? []).map(f => `  ${f.timestamp_utc?.slice(11, 19)} ${f.stage.padEnd(13)} ${String(f.model ?? '').padEnd(22)} ${f.execution_mode ?? ''} ${f.end_to_end_ms ? Math.round(f.end_to_end_ms) + ' ms' : (f.load_ms ? 'carga ' + Math.round(f.load_ms) + ' ms' : '')} ${f.throughput_tps ? Math.round(f.throughput_tps) + ' tok/s' : ''}`),
  ].join('\n');
}
refrescar(); setInterval(refrescar, 4000);
</script>
</html>
